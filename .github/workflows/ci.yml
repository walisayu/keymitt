name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features testing -- -D warnings
      - run: cargo test --features testing

  # Exercises the real OS credential store through `keymitt doctor`
  # (writes, reads and deletes a probe entry). Built without `testing`.
  keychain:
    name: keychain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build
      - name: doctor (Linux, Secret Service via gnome-keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "keymitt-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && KEYMITT_HOME="$RUNNER_TEMP/km" ./target/debug/keymitt doctor'
      - name: doctor (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: KEYMITT_HOME="$RUNNER_TEMP/km" ./target/debug/keymitt doctor
