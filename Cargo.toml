[package]
name = "keymitt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Let AI agents use your secrets without ever seeing them — an MCP credential broker backed by your OS keychain."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "secrets", "keychain", "ai-agents", "credentials"]
categories = ["command-line-utilities", "authentication"]

[features]
default = []
# Test-only escape hatches (in-memory vault, scripted approvals, helper subcommand).
# NEVER enable this feature for builds you install or distribute.
testing = []

[dependencies]
age = { version = "0.12.1", default-features = false, features = ["armor"] }
aho-corasick = "1.1.5"
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
keyring = "4.2.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rpassword = "7.5.4"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
which = "8.0.6"
zeroize = { version = "1.9.1", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
windows-core = "0.62.2"
windows-future = "0.3.2"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
